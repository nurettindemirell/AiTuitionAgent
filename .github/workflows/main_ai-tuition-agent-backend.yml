name: Build and deploy Node.js app to Azure Web App - ai-tuition-agent-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # ⬇️ ÖNEMLİ: backend klasörüne gir
      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1E48FC58F59C4623A1146297B309EDEB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_11F162A2CA594C3DA701DD1819BF989A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C3B44D0EFB1E441B9EC5A5B2D2B93838 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ai-tuition-agent-backend
          slot-name: Production
          - name: Deploy to Azure Web App
  uses: azure/webapps-deploy@v3
  with:
    app-name: ai-tuition-agent-backend
    slot-name: Production
    package: backend-app


